name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard
          npm install

      - name: Lint HTML
        run: htmlhint "**/*.html"

      - name: Lint CSS
        run: |
          echo '{
            "extends": "stylelint-config-standard"
          }' > .stylelintrc.json
          stylelint "**/*.css"

  build:
    name: Build with Parcel
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project with Parcel
        run: npx parcel build src/index.html --dist-dir dist --no-source-maps
